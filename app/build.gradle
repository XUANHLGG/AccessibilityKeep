plugins {
    id "com.android.application"
}

android {
    namespace "com.tendoarisu.accessibilitykeep"
    compileSdk 35

    defaultConfig {
        applicationId "com.tendoarisu.accessibilitykeep"
        minSdk 35
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def localXposedApi = file("../lib/api-82.jar")
    compileOnly localXposedApi.exists()
            ? files(localXposedApi)
            : "de.robv.android.xposed:api:82"
}
